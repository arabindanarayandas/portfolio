<style>
  /* Layout: one phone-width column. Home has three tabs (Learn, Guide, Check); lessons run one card at a time with a bottom action bar. */
  :root {

  /* lesson */

  .x { border: 0; background: none; padding: 6px; color: var(--muted); flex: none; }

  .foot { position: sticky; bottom: 0; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px); background: var(--paper); border-top: 1px solid var(--line); }

<script>
(function () {

      '<p style="margin-top:10px">Long and short vowels change meaning, so hold the doubled ones. Kannada also has sounds made with the tongue curled back (like the d in ಡ). Our letters don\'t mark these yet, so the listen button and native speakers are your best guide.</p>';
    app.appendChild(g1);
    var g2 = h('section', 'gsec');
    var pats = [
      ['The verb goes last', 'English says "I work here". Kannada says "I here work do".', 'naanu illi kelasa maadteeni', 'I work here'],
      ['End requests with -i to be polite', 'hogu means "go" to a friend. hogi is the polite form for anyone else.', 'illi nillisi', 'Stop here (polite)'],
      ['Add -aa to ask a question', 'Turn any statement into a yes or no question.', 'seat ide → seat ideyaa?', 'There is a seat → Is there a seat?'],
      ['-ge means "to"', 'Add it to any place you want to go.', 'Indiranagar-ge', 'to Indiranagar'],
      ['-alli means "in" or "at"', 'Add it to a place to say where something is.', 'Bengaloorinalli', 'in Bengaluru'],
      ['beku and beda', 'beku means "I want / I need". beda means "I don\'t want". Put them after the thing.', 'parcel beku · khaara beda', 'I want it packed · No spice']
    ];
    g2.innerHTML = '<h2>Six patterns that unlock most sentences</h2>' + pats.map(function (p) { return '<div class="pattern"><b>' + esc(p[0]) + '</b>' + esc(p[1]) + '<div class="ex"><span>' + esc(p[2]) + '</span> = ' + esc(p[3]) + '</div></div>'; }).join('');
    app.appendChild(g2);
    var nums = [['1', 'ಒಂದು', 'ondu'], ['2', 'ಎರಡು', 'eradu'], ['3', 'ಮೂರು', 'mooru'], ['4', 'ನಾಲ್ಕು', 'naalku'], ['5', 'ಐದು', 'aidu'], ['6', 'ಆರು', 'aaru'], ['7', 'ಏಳು', 'elu'], ['8', 'ಎಂಟು', 'entu'], ['9', 'ಒಂಬತ್ತು', 'ombattu'], ['10', 'ಹತ್ತು', 'hattu'], ['20', 'ಇಪ್ಪತ್ತು', 'ippattu'], ['50', 'ಐವತ್ತು', 'aivattu'], ['100', 'ನೂರು', 'nooru'], ['1,000', 'ಸಾವಿರ', 'saavira']];
    var g3 = h('section', 'gsec');
    g3.innerHTML = '<h2>Numbers</h2><div class="tablewrap"><table><thead><tr><th>Number</th><th>Kannada</th><th>Say</th></tr></thead><tbody>' + nums.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="k">' + r[1] + '</td><td class="r">' + r[2] + '</td></tr>'; }).join('') + '</tbody></table></div><p style="margin-top:10px">Prices are usually said with these numbers, but many people mix in English numbers too. Both are fine.</p>';
    app.appendChild(g3);
    var days = [['Sunday', 'ಭಾನುವಾರ', 'bhaanuvaara'], ['Monday', 'ಸೋಮವಾರ', 'somavaara'], ['Tuesday', 'ಮಂಗಳವಾರ', 'mangalavaara'], ['Wednesday', 'ಬುಧವಾರ', 'budhavaara'], ['Thursday', 'ಗುರುವಾರ', 'guruvaara'], ['Friday', 'ಶುಕ್ರವಾರ', 'shukravaara'], ['Saturday', 'ಶನಿವಾರ', 'shanivaara']];
    var g4 = h('section', 'gsec');
    g4.innerHTML = '<h2>Days of the week</h2><div class="tablewrap"><table><thead><tr><th>Day</th><th>Kannada</th><th>Say</th></tr></thead><tbody>' + days.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="k">' + r[1] + '</td><td class="r">' + r[2] + '</td></tr>'; }).join('') + '</tbody></table></div><p style="margin-top:10px">Every day ends in -vaara, which means "day of the week".</p>';
    app.appendChild(g4);
    var vow = [['ಅ', 'a'], ['ಆ', 'aa'], ['ಇ', 'i'], ['ಈ', 'ee'], ['ಉ', 'u'], ['ಊ', 'oo'], ['ಎ', 'e (short)'], ['ಏ', 'e (long)'], ['ಐ', 'ai'], ['ಒ', 'o (short)'], ['ಓ', 'o (long)'], ['ಔ', 'au']];
    var g5 = h('section', 'gsec');
    g5.innerHTML = '<h2>The script, when you\'re ready</h2><p>You can learn every phrase in English letters first. When you want to read signs and bus boards, start with these vowels.</p><div class="letters">' + vow.map(function (v) { return '<div><b>' + v[0] + '</b><span>' + v[1] + '</span></div>'; }).join('') + '</div><p style="margin-top:12px">Kannada is written left to right. Each consonant carries a vowel sound, and small marks around it change that vowel. Turn on "Kannada script" in the Learn tab to see it under every phrase.</p>';
    app.appendChild(g5);
    app.appendChild(h('p', 'note', 'Spotted something off? Use the Check tab to tell us.'));
    window.scrollTo(0, 0);
  }

  /* ---------- check (for native speakers) ---------- */
  var filter = 'all';
  function check() {
    showTabs(true); app.innerHTML = '';
    app.appendChild(topbar());
    app.appendChild(h('div', 'pagehead', '<span class="eyebrow">For Kannada speakers</span><h1>Check our Kannada</h1><p>We want every phrase to sound like a real Bengalurean, not a textbook. Tap ✓ if a phrase is right. If there\'s a better or more natural way to say it, suggest a fix and it will come to us by email.</p>'));
    var f = h('div', 'filters');
    var opts = [['all', 'All ' + ALL.length]].concat(C.units.map(function (U, i) { return ['u' + i, (i + 1) + '. ' + U.title]; })).concat([['todo', 'Not checked yet']]);
    opts.forEach(function (o) {
      var b = h('button', '', esc(o[1])); b.type = 'button'; b.setAttribute('aria-pressed', filter === o[0] ? 'true' : 'false');
      b.addEventListener('click', function () { filter = o[0]; check(); });
      f.appendChild(b);
    });
    app.appendChild(f);
    var checkedN = Object.keys(S.checked).length;
    app.appendChild(h('div', 'progressline', 'You\'ve checked <b>' + checkedN + '</b> of ' + ALL.length + ' phrases. Thank you.'));
    var list = h('div', 'citems');
    ALL.filter(function (it) {
      if (filter === 'all') return true;
      if (filter === 'todo') return !S.checked[it.id];
      return it.L.ui === +filter.slice(1);
    }).forEach(function (it) { list.appendChild(checkItem(it)); });
    if (!list.children.length) list.appendChild(h('p', 'note', 'Nothing left here. You\'ve checked every phrase in this list.'));
    app.appendChild(list);
    app.appendChild(h('p', 'note', 'Fixes open your email app with the details filled in. Nothing is sent until you press send. ✓ taps are counted anonymously.'));
    window.scrollTo(0, 0);
  }
  function checkItem(it) {
    var st = S.checked[it.id];
    var card = h('div', 'citem' + (st === 'ok' ? ' ok' : st === 'fix' ? ' fixed' : ''));
    var head = h('div', 'head');
    head.appendChild(h('div', '', '<div class="kn-big">' + esc(it.kn) + '</div><div class="ro">' + esc(it.ro) + '</div><div class="en">' + esc(it.en) + '</div>'));
    head.appendChild(sayBtn(it));
    card.appendChild(head);
    card.appendChild(h('div', 'where', 'Unit ' + (it.L.ui + 1) + ' · ' + esc(it.L.title) + ' · ' + it.id));
    var acts = h('div', 'acts');
    var yes = h('button', 'yes', '✓ Sounds right'); yes.type = 'button'; yes.setAttribute('aria-pressed', st === 'ok' ? 'true' : 'false');
    var fix = h('button', 'fix', '✎ Suggest a fix'); fix.type = 'button'; fix.setAttribute('aria-pressed', st === 'fix' ? 'true' : 'false');
    acts.appendChild(yes); acts.appendChild(fix); card.appendChild(acts);
    var form = null;
    yes.addEventListener('click', function () {
      if (S.checked[it.id] === 'ok') return;
      S.checked[it.id] = 'ok'; save(); track('maatu-ok-' + it.id, 'Maatu ✓ ' + it.ro);
      yes.setAttribute('aria-pressed', 'true'); fix.setAttribute('aria-pressed', 'false');
      card.className = 'citem ok'; if (form) { form.remove(); form = null; }
      toast('Thanks! Marked as right.');
    });
    fix.addEventListener('click', function () {
      if (form) { form.remove(); form = null; return; }
      form = h('div', 'fixform');
      form.innerHTML = '<label for="kn-' + it.id + '">Better Kannada</label><input class="knin" id="kn-' + it.id + '" value="' + esc(it.kn) + '">' +
        '<label for="ro-' + it.id + '">How it sounds in English letters (optional)</label><input id="ro-' + it.id + '" value="' + esc(it.ro) + '">' +
        '<label for="nt-' + it.id + '">What should change, and why? (optional)</label><textarea id="nt-' + it.id + '" rows="3" placeholder="For example: people in Bengaluru usually say ... instead"></textarea>' +
        '<div class="row2"><button type="button" class="send">Send by email</button><button type="button" class="alt copy">Copy text</button></div><small>Your email app opens with this filled in. If it doesn\'t, copy the text and send it to ' + EMAIL + '.</small>';
      card.appendChild(form);
      function body() {
        return 'Phrase: ' + it.id + ' (Unit ' + (it.L.ui + 1) + ', ' + it.L.title + ')\n' +
          'English: ' + it.en + '\nCurrent Kannada: ' + it.kn + '\nCurrent English letters: ' + it.ro + '\n\n' +
          'Suggested Kannada: ' + form.querySelector('#kn-' + it.id).value + '\nSuggested English letters: ' + form.querySelector('#ro-' + it.id).value + '\nNote: ' + form.querySelector('#nt-' + it.id).value + '\n';
      }
      function mark() { S.checked[it.id] = 'fix'; save(); card.className = 'citem fixed'; fix.setAttribute('aria-pressed', 'true'); yes.setAttribute('aria-pressed', 'false'); track('maatu-fix-' + it.id, 'Maatu fix ' + it.ro); }
      form.querySelector('.send').addEventListener('click', function () {
        mark();
        window.location.href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent('Maatu fix: ' + it.id + ' "' + it.en + '"') + '&body=' + encodeURIComponent(body());
      });
      form.querySelector('.copy').addEventListener('click', function () {
        var txt = 'Maatu fix\n' + body();
        if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { mark(); toast('Copied. Paste it into an email to ' + EMAIL); }, function () { toast('Could not copy. Please email ' + EMAIL); });
        else toast('Please email ' + EMAIL);
      });
      form.querySelector('#kn-' + it.id).focus();
    });
    return card;
  }

  /* ---------- lesson ---------- */
  var R = null;
  function startLesson(gi) {
    var L = LESSONS[gi], items = L.items, idx = items.map(function (_, i) { return i; }), steps = [];
    items.forEach(function (_, i) {
      steps.push({ t: 'intro', i: i });
      if (i % 2 === 1) steps.push({ t: i % 4 === 1 ? 'meaning' : 'reverse', i: i - Math.floor(Math.random() * 2) });
    });
    steps.push({ t: 'match', set: shuffle(idx).slice(0, 4) });
    var multi = shuffle(idx.filter(function (i) { return items[i].ro.split(' ').length >= 2; }));
    multi.slice(0, 2).forEach(function (i) { steps.push({ t: 'build', i: i }); });
    if (knVoice) steps.push({ t: 'listen', i: shuffle(idx)[0] });
    steps.push({ t: 'reverse', i: shuffle(idx)[0] });
    steps.push({ t: 'situation' });
    R = { gi: gi, L: L, steps: steps, pos: 0, right: 0, asked: 0, retried: {} };
    showTabs(false);
    track('maatu-start-' + L.id, 'Maatu start ' + L.title);
    renderStep();
  }
  function frame() {
    app.innerHTML = '';
    var head = h('div', 'lhead');
    var x = h('button', 'x', XICON); x.type = 'button'; x.setAttribute('aria-label', 'Leave lesson');
    x.addEventListener('click', function () { setTab('learn'); });
    head.appendChild(x);
    head.appendChild(h('div', 'bar', '<b style="width:' + Math.round(R.pos / R.steps.length * 100) + '%"></b>'));
    app.appendChild(head);
    var body = h('div', 'body'); app.appendChild(body);
    var foot = h('div', 'foot'); app.appendChild(foot);
    window.scrollTo(0, 0);
    return { body: body, foot: foot };
  }
  function cta(foot, label, fn, disabled) { foot.innerHTML = ''; var b = h('button', 'main', esc(label)); b.type = 'button'; b.disabled = !!disabled; b.addEventListener('click', fn); foot.appendChild(b); return b; }
  function next() { R.pos++; if (R.pos < R.steps.length) renderStep(); else finish(); }
  function result(f, ok, it) {
    R.asked++; if (ok) R.right++;
    blip(ok ? 'good' : 'bad');
    var st = R.steps[R.pos];
    if (!ok && !R.retried[R.pos] && st.t !== 'situation') { R.retried[R.pos] = 1; R.steps.push(Object.assign({}, st)); R.retried[R.steps.length - 1] = 1; }
    f.foot.className = 'foot ' + (ok ? 'good' : 'bad');
    f.foot.innerHTML = '<h3>' + (ok ? ['Correct!', 'Nice!', 'Sari!', 'Super!', 'Sakkath!'][Math.floor(Math.random() * 5)] : 'Not quite') + '</h3><p>' + phraseText(it) + ' means <b>' + esc(it.en) + '</b>.' + (ok ? '' : ' We\'ll ask again at the end.') + '</p>';
    var b = h('button', 'main', 'Continue'); b.type = 'button'; b.addEventListener('click', next); f.foot.appendChild(b);
    b.focus({ preventScroll: true });
  }
  function choiceList(f, opts, correct, render, it) {
    var box = h('div', 'opts');
    opts.forEach(function (o) {
      var b = h('button', 'opt', render(o)); b.type = 'button';
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(box.children, function (c) { c.disabled = true; c.classList.add('dim'); });
        b.classList.remove('dim');
        var ok = o === correct;
        b.classList.add(ok ? 'good' : 'bad');
        if (!ok) { var r = box.children[opts.indexOf(correct)]; r.classList.remove('dim'); r.classList.add('good'); }
        result(f, ok, it);
      });
      box.appendChild(b);
    });
    f.body.appendChild(box);
  }
  function kdisp(it) { return '<span class="r">' + esc(it.ro) + '</span>' + (S.script ? '<span class="s">' + esc(it.kn) + '</span>' : ''); }
  function phraseCard(it, withEn) {
    var card = h('div', 'phrase');
    var row = h('div', 'row'); var t = h('div', '');
    t.innerHTML = '<div class="ro">' + esc(it.ro) + '</div>' + (S.script ? '<div class="script">' + esc(it.kn) + '</div>' : '');
    row.appendChild(t); row.appendChild(sayBtn(it)); card.appendChild(row);
    if (withEn) {
      card.appendChild(h('div', 'en', esc(it.en)));
      if (it.bd) card.appendChild(h('div', 'bd', it.bd.map(function (p) { return '<span><b>' + esc(p[0]) + '</b> · ' + esc(p[1]) + '</span>'; }).join('')));
    }
    return card;
  }
  function renderStep() {
    var st = R.steps[R.pos], items = R.L.items, f = frame(), it = items[st.i];
    if (st.t === 'intro') {
      f.body.appendChild(h('div', 'label', 'New phrase · ' + (st.i + 1) + ' of ' + items.length));
      f.body.appendChild(h('div', 'ask', 'Learn this one'));
      f.body.appendChild(phraseCard(it, true));
      if (it.tip) f.body.appendChild(h('div', 'tip', '<b>Tip</b><span>' + esc(it.tip) + '</span>'));
      cta(f.foot, 'Got it', next);
    } else if (st.t === 'meaning' || st.t === 'listen') {
      f.body.appendChild(h('div', 'label', st.t === 'listen' ? 'Listen' : 'Practice'));
      if (st.t === 'listen') { f.body.appendChild(h('div', 'ask', 'What do you hear?')); f.body.appendChild(sayBtn(it, true)); setTimeout(function () { speak(it); }, 250); }
      else { f.body.appendChild(h('div', 'ask', 'What does this mean?')); var p = phraseCard(it, false); p.style.marginBottom = '16px'; f.body.appendChild(p); }
      choiceList(f, shuffle([it].concat(pick(items, 3, [it]))), it, function (o) { return esc(o.en); }, it);
      f.foot.innerHTML = '';
    } else if (st.t === 'reverse') {
      f.body.appendChild(h('div', 'label', 'Practice'));
      f.body.appendChild(h('div', 'ask', 'How do you say “' + esc(it.en) + '”?'));
      choiceList(f, shuffle([it].concat(pick(items, 3, [it]))), it, kdisp, it);
      f.foot.innerHTML = '';
    } else if (st.t === 'build') {
      f.body.appendChild(h('div', 'label', 'Build it'));
      f.body.appendChild(h('div', 'ask', 'Say “' + esc(it.en) + '” in Kannada'));
      var answer = it.ro.split(' ');
      var others = []; items.forEach(function (o) { if (o !== it) o.ro.split(' ').forEach(function (w) { if (answer.indexOf(w) < 0 && others.indexOf(w) < 0) others.push(w); }); });
      var tiles = shuffle(answer.concat(shuffle(others).slice(0, 2)));
      var slots = h('div', 'slots'), pool = h('div', 'tiles'), chosen = [], checkBtn;
      f.body.appendChild(slots); f.body.appendChild(pool);
      tiles.forEach(function (w) {
        var b = h('button', 'tile', esc(w)); b.type = 'button';
        b.addEventListener('click', function () {
          if (b.classList.contains('used')) return;
          b.classList.add('used');
          var s = h('button', 'tile', esc(w)); s.type = 'button';
          var entry = { w: w }; chosen.push(entry);
          s.addEventListener('click', function () { chosen.splice(chosen.indexOf(entry), 1); s.remove(); b.classList.remove('used'); checkBtn.disabled = !chosen.length; });
          slots.appendChild(s); checkBtn.disabled = false;
        });
        pool.appendChild(b);
      });
      checkBtn = cta(f.foot, 'Check', function () {
        var ok = chosen.map(function (c) { return c.w; }).join(' ') === it.ro;
        Array.prototype.forEach.call(pool.children, function (b) { b.disabled = true; });
        Array.prototype.forEach.call(slots.children, function (b) { b.disabled = true; });
        result(f, ok, it);
      }, true);
    } else if (st.t === 'match') {
      f.body.appendChild(h('div', 'label', 'Match'));
      f.body.appendChild(h('div', 'ask', 'Tap the matching pairs'));
      var set = st.set.map(function (i) { return items[i]; });
      var grid = h('div', 'pairs'), lc = h('div', 'col'), rc = h('div', 'col');
      grid.appendChild(lc); grid.appendChild(rc); f.body.appendChild(grid);
      var selL = null, selR = null, matched = 0, misses = 0;
      function tryPair() {
        if (!selL || !selR) return;
        var a = selL, b = selR; selL = selR = null;
        if (a._it === b._it) { a.classList.remove('sel'); b.classList.remove('sel'); a.classList.add('ok'); b.classList.add('ok'); a.disabled = b.disabled = true; matched++; blip('good');
          if (matched === set.length) { R.asked++; if (!misses) R.right++; cta(f.foot, 'Continue', next); } }
        else { misses++; blip('bad'); a.classList.add('no'); b.classList.add('no'); setTimeout(function () { a.classList.remove('no', 'sel'); b.classList.remove('no', 'sel'); }, 450); }
      }
      shuffle(set).forEach(function (x) { var b = h('button', 'kn-btn', esc(x.ro) + (S.script ? '<br><span style="font-size:.85em;opacity:.7">' + esc(x.kn) + '</span>' : '')); b.type = 'button'; b._it = x; b.addEventListener('click', function () { if (selL) selL.classList.remove('sel'); selL = b; b.classList.add('sel'); if (knVoice) speak(x); tryPair(); }); lc.appendChild(b); });
      shuffle(set).forEach(function (x) { var b = h('button', '', esc(x.en)); b.type = 'button'; b._it = x; b.addEventListener('click', function () { if (selR) selR.classList.remove('sel'); selR = b; b.classList.add('sel'); tryPair(); }); rc.appendChild(b); });
      cta(f.foot, 'Continue', next, true);
    } else if (st.t === 'situation') {
      var s = R.L.situation, ans = items[s.a];
      f.body.appendChild(h('div', 'label', 'Real life'));
      f.body.appendChild(h('div', 'ask', s.mode === 'meaning' ? 'What does it mean?' : 'What would you say?'));
      f.body.appendChild(h('div', 'scene', '<i>?</i><span>' + esc(s.q) + '</span>'));
      var opts3 = shuffle([ans].concat(pick(items, 3, [ans])));
      if (s.mode === 'meaning') choiceList(f, opts3, ans, function (o) { return esc(o.en); }, ans);
      else choiceList(f, opts3, ans, kdisp, ans);
      f.foot.innerHTML = '';
    }
  }
  function finish() {
    blip('win');
    var acc = R.asked ? Math.round(R.right / R.asked * 100) : 100;
    var xp = 10 + (acc === 100 ? 5 : 0);
    var first = !S.done[R.L.id];
    S.done[R.L.id] = true; S.xp += xp;
    if (S.last !== today()) { S.streak = S.last === today(-864e5) ? S.streak + 1 : 1; S.last = today(); }
    save();
    if (first) track('maatu-done-' + R.L.id, 'Maatu done ' + R.L.title);
    app.innerHTML = '';
    var w = h('div', 'done-wrap');
    w.appendChild(h('div', 'label', 'Unit ' + (R.L.ui + 1) + ' · Lesson ' + (R.L.li + 1) + ' complete'));
    w.appendChild(h('h2', '', acc === 100 ? 'Tumba chennaagide!' : 'Chennaagide!'));
    w.appendChild(h('p', '', acc === 100 ? 'Perfect score. That means "very good" in Kannada.' : 'That means "good" in Kannada. Keep going.'));
    w.appendChild(h('div', 'stats', '<div><b>+' + xp + '</b><span>XP earned</span></div><div><b>' + acc + '%</b><span>Accuracy</span></div>'));
    w.appendChild(h('div', 'label', 'Phrases you learned'));
    var lw = h('div', 'learned');
    R.L.items.forEach(function (it) { var d = h('div', ''); d.appendChild(h('span', '', '<b>' + esc(it.ro) + (S.script ? ' <span style="opacity:.6;font-weight:600">' + esc(it.kn) + '</span>' : '') + '</b><small>' + esc(it.en) + '</small>')); d.appendChild(sayBtn(it)); lw.appendChild(d); });
    w.appendChild(lw);
    app.appendChild(w);
    var foot = h('div', 'foot'); app.appendChild(foot);
    var n = nextLesson();
    var b = h('button', 'main', n < LESSONS.length ? 'Next: ' + esc(LESSONS[n].title) : 'Back to the course');
    b.type = 'button'; b.addEventListener('click', function () { if (n < LESSONS.length) startLesson(n); else setTab('learn'); });
    foot.appendChild(b);
    if (n < LESSONS.length) { var hb = h('button', 'go soft', 'Back to the course'); hb.type = 'button'; hb.style.cssText = 'width:100%;margin-top:10px;min-height:48px'; hb.addEventListener('click', function () { setTab('learn'); }); foot.appendChild(hb); }
    window.scrollTo(0, 0);
    if (n >= LESSONS.length) toast('You finished the whole course. Shabash! More units are coming.');
  }

  window.__maatu = { get R() { return R; }, setTab: setTab };
  var start = (location.hash || '').replace('#', '');
  setTab(start === 'check' || start === 'guide' ? start : 'learn');
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
