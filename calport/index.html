<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Calport · beta preview</title>
<meta name="description" content="Calport: placement prep with seniors who got placed. Beta preview for testing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<style>
  /* Layout: an app shell. Sidebar navigation on the left (a top bar on phones), one working column on the right, generous white space. Deliberately one look: white paper, black type. */
  :root {
    --bg: #FFFFFF; --ink: #0A0A0A; --muted: #6B6B6B; --faint: #9A9A9A; --line: #EBEBEB; --line2: #DADADA; --soft: #F5F5F5; --soft2: #FAFAFA;
    --sans: "Geist", "Helvetica Neue", Arial, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  h1, h2, h3, h4 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  h1 { font-size: clamp(1.7rem, 3.6vw, 2.3rem); line-height: 1.1; font-weight: 600; letter-spacing: -0.035em; }
  h2 { font-size: 1.3rem; font-weight: 600; line-height: 1.25; }
  h3 { font-size: 1.02rem; font-weight: 600; }
  h4 { font-size: .92rem; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }
  .tiny { font-size: .8rem; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stack { display: grid; gap: 12px; }
  .stack-lg { display: grid; gap: 24px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .between { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .grid-main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 980px) { .grid2, .grid3, .grid-main { grid-template-columns: 1fr; } }
  .hr { height: 1px; background: var(--line); border: 0; margin: 0; }

  /* buttons and inputs */
  .btn { border: 1px solid var(--ink); background: var(--ink); color: #FFFFFF; border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .btn:hover { background: #2A2A2A; }
  .btn.ghost { background: #FFFFFF; color: var(--ink); border-color: var(--line2); }
  .btn.ghost:hover { border-color: var(--ink); background: #FFFFFF; }
  .btn.text { background: none; border: 0; color: var(--ink); padding: 0; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
  .btn.sm { padding: 6px 11px; font-size: .84rem; }
  .btn.lg { padding: 12px 20px; font-size: 1rem; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .field { display: grid; gap: 6px; }
  .field > span:first-child { font-size: .85rem; font-weight: 500; }
  .hint { font-size: .8rem; color: var(--muted); }
  input[type=text], input[type=email], input[type=number], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line2); border-radius: 8px; padding: 9px 11px; background: #FFFFFF; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10, 10, 10, .06); }
  textarea { resize: vertical; line-height: 1.55; }
  textarea.code { font: 13px/1.55 var(--mono); }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; background: #FFFFFF; }
  .seg button { border: 0; background: none; padding: 7px 12px; font-size: .86rem; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }

  /* surfaces */
  .card { border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; }
  .card.pad { padding: 20px; }
  .card.pad-lg { padding: 28px; }
  .card-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-body { padding: 20px; }
  .tile { padding: 18px 20px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; }
  .tiles > div { padding: 18px 20px; min-width: 0; }
  .tiles > div + div { border-left: 1px solid var(--line); }
  .tiles b { display: block; font-size: 1.8rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tiles span { font-size: .84rem; color: var(--muted); }
  @media (max-width: 980px) { .tiles { grid-template-columns: 1fr 1fr; } .tiles > div:nth-child(3) { border-left: 0; } .tiles > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
  .meter { height: 6px; background: var(--soft); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .meter i { display: block; height: 100%; background: var(--ink); border-radius: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line2); white-space: nowrap; }
  .pill.solid { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
  .pill.grey { background: var(--soft); border-color: var(--soft); }
  .pill.dash { border-style: dashed; color: var(--muted); }
  .tag { font: 500 .7rem/1 var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 4px 7px; border-radius: 5px; background: var(--soft); white-space: nowrap; }
  .banner { padding: 12px 14px; background: var(--soft); border-radius: 10px; font-size: .9rem; }
  .note { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: .88rem; color: var(--muted); }
  .note b { color: var(--ink); }
  .status { padding: 11px 13px; border-radius: 9px; background: var(--soft); font-size: .9rem; }
  .status.err { background: #FFFFFF; border: 1px solid var(--ink); }
  .empty { text-align: center; padding: 40px 20px; border: 1px dashed var(--line2); border-radius: 12px; }
  .empty h3 { margin-bottom: 6px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 600; font-size: .9rem; flex: none; }
  .avatar.lg { width: 56px; height: 56px; font-size: 1.2rem; }
  .avatar.ink { background: var(--ink); color: #FFFFFF; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { padding: 14px 0; border-top: 1px solid var(--line); }
  .list > li:first-child { border-top: 0; }
  .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
  .dots i { width: 11px; height: 11px; border-radius: 3px; background: #E6E6E6; }
  .dots i.on { background: var(--ink); }
  .score { display: inline-flex; align-items: center; font-weight: 600; font-size: .82rem; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .score.s4 { background: var(--ink); color: #FFFFFF; }
  .score.s3 { background: #E6E6E6; }
  .score.s2 { border-color: var(--ink); }
  .score.s1 { border: 1px dashed var(--faint); color: var(--muted); }
  .thinking { display: inline-flex; align-items: center; gap: 10px; }
  .thinking::before { content: ""; width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #FFFFFF; padding: 11px 16px; border-radius: 10px; font-size: .9rem; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0, 0, 0, .15); }

  /* login */
  .login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .login-brand { background: var(--ink); color: #FFFFFF; padding: 48px max(32px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
  .login-brand h1 { font-size: clamp(2rem, 4vw, 3rem); max-width: 14ch; }
  .login-brand p { color: #BDBDBD; max-width: 42ch; font-size: 1.02rem; margin-top: 16px; }
  .login-brand ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; max-width: 44ch; }
  .login-brand li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; color: #D6D6D6; }
  .login-brand li b { color: #FFFFFF; display: block; }
  .login-form { padding: 48px max(32px, env(safe-area-inset-right, 0px)) 48px 32px; display: flex; align-items: center; justify-content: center; }
  .login-form .inner { width: 100%; max-width: 420px; display: grid; gap: 22px; }
  .demo-acct { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line2); border-radius: 12px; background: #FFFFFF; text-align: left; width: 100%; }
  .demo-acct:hover { border-color: var(--ink); }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .82rem; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  @media (max-width: 860px) { .login { grid-template-columns: 1fr; } .login-brand { padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 28px; } .login-brand ul { display: none; } .login-form { padding: 28px 20px 48px; } }

  /* app shell */
  .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); padding: 22px 14px 16px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.05rem; padding: 0 8px; letter-spacing: -0.02em; }
  .brand i { width: 24px; height: 24px; border-radius: 6px; background: var(--ink); color: #FFFFFF; display: grid; place-items: center; font-style: normal; font-size: .78rem; }
  .brand small { font-weight: 500; font-size: .72rem; color: var(--muted); border: 1px solid var(--line2); padding: 1px 6px; border-radius: 999px; margin-left: 2px; letter-spacing: 0; }
  .nav { display: grid; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 11px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; color: #3A3A3A; font-size: .92rem; text-align: left; width: 100%; }
  .nav button svg { width: 18px; height: 18px; flex: none; }
  .nav button:hover { background: var(--soft2); }
  .nav button[aria-current="page"] { background: var(--soft); color: var(--ink); font-weight: 600; }
  .nav .count { margin-left: auto; font: 600 .72rem/1 var(--mono); background: var(--ink); color: #FFFFFF; padding: 3px 6px; border-radius: 999px; }
  .side-foot { margin-top: auto; display: grid; gap: 10px; }
  .me { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .me b { display: block; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me span { font-size: .76rem; color: var(--muted); }
  .main { padding: 36px max(40px, env(safe-area-inset-right, 0px)) 96px 40px; min-width: 0; }
  .main-inner { max-width: 1100px; margin: 0 auto; display: grid; gap: 28px; }
  .main-inner > * { min-width: 0; }
  .stack > *, .stack-lg > *, .grid2 > *, .grid3 > *, .grid-main > * { min-width: 0; }
  .pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .pagehead p { margin-top: 6px; color: var(--muted); max-width: 64ch; }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { min-width: 0; position: sticky; top: 0; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
    .nav { display: flex; overflow-x: auto; scrollbar-width: none; gap: 2px; margin: 0 -6px; }
    .nav button { width: auto; white-space: nowrap; padding: 7px 10px; font-size: .86rem; }
    .nav button svg { display: none; }
    .side-foot { display: none; }
    .main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
    .mobile-acct { display: flex !important; }
  }
  .mobile-acct { display: none; position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
  .subnav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .subnav button { border: 0; background: none; padding: 10px 12px; font-size: .9rem; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .subnav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .subnav button:disabled { opacity: .35; cursor: default; }

  /* learner pieces */
  .next { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px 22px; border-radius: 12px; background: var(--ink); color: #FFFFFF; }
  .next .label { color: #BDBDBD; }
  .next h3 { font-size: 1.15rem; margin-top: 4px; }
  .next p { color: #D0D0D0; font-size: .9rem; margin-top: 4px; }
  .next .btn { background: #FFFFFF; color: var(--ink); border-color: #FFFFFF; }
  @media (max-width: 560px) { .next { grid-template-columns: 1fr; } }
  .years { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; }
  .year { padding: 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
  .year + .year { border-left: 1px solid var(--line); }
  .year.now { background: var(--soft2); }
  .year.later { color: var(--muted); }
  @media (max-width: 980px) { .years { grid-template-columns: 1fr 1fr; } .year:nth-child(3) { border-left: 0; } .year:nth-child(n+3) { border-top: 1px solid var(--line); } }
  @media (max-width: 560px) { .years { grid-template-columns: 1fr; } .year + .year { border-left: 0; border-top: 1px solid var(--line); } }
  .here { font: 600 .66rem/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; background: var(--ink); color: #FFFFFF; padding: 4px 7px; border-radius: 4px; justify-self: start; }
  .ms { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ms li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; font-size: .9rem; }
  .tick { width: 18px; height: 18px; border: 1.5px solid var(--ink); border-radius: 5px; background: #FFFFFF; padding: 0; display: grid; place-items: center; font-size: .7rem; color: #FFFFFF; margin-top: 2px; }
  .tick[aria-pressed="true"] { background: var(--ink); }
  .tick:disabled { cursor: default; }
  .act { display: inline-block; margin-top: 3px; font-size: .82rem; font-weight: 600; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .lb { list-style: none; margin: 0; padding: 0; }
  .lb li { display: grid; grid-template-columns: 30px 32px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; font-size: .92rem; }
  .lb li:first-child { border-top: 0; }
  .lb li.mine { font-weight: 700; }
  .lb .avatar { width: 30px; height: 30px; font-size: .74rem; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { font-size: .82rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ink); }
  .badge.off { border: 1px dashed var(--line2); color: var(--faint); }
  .experts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .expert { padding: 18px; display: grid; gap: 10px; align-content: start; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
  .slots button { border: 1px solid var(--line2); background: #FFFFFF; border-radius: 8px; padding: 8px 6px; font-size: .84rem; }
  .slots button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line2); background: #FFFFFF; border-radius: 999px; padding: 5px 11px; font-size: .84rem; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
  .res { list-style: none; margin: 0; padding: 0; }
  .res li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 11px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .res li:first-child { border-top: 0; }
  .res a { font-weight: 600; text-decoration: none; }
  .res a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .res .by { grid-column: 1 / -1; font-size: .84rem; color: var(--muted); }
  .kind { font: 500 .68rem/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
  .stars { display: inline-flex; gap: 2px; }
  .stars button { border: 0; background: none; padding: 0 2px; font-size: 1.25rem; line-height: 1; color: var(--line2); }
  .stars button.on { color: var(--ink); }

  /* practice flow (job-specific prep) */
  .qwrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
  @media (max-width: 980px) { .qwrap { grid-template-columns: 1fr; } }
  .prompt { font-size: 1.05rem; white-space: pre-wrap; }
  .clock { font: 600 1.6rem/1 var(--mono); font-variant-numeric: tabular-nums; }
  .prog { display: flex; gap: 4px; margin-top: 12px; }
  .prog i { flex: 1; height: 5px; border-radius: 5px; background: var(--soft); }
  .prog i.done { background: var(--ink); }
  .prog i.now { background: var(--faint); }
  .scale { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .scale div { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: .8rem; color: var(--muted); }
  .scale div b { display: block; color: var(--ink); font: 500 .74rem var(--mono); margin-bottom: 2px; }
  .scale div.hit { border-color: var(--ink); color: var(--ink); background: var(--soft2); }
  @media (max-width: 640px) { .scale { grid-template-columns: 1fr 1fr; } }
  .better { padding: 14px; border-radius: 10px; background: var(--soft); white-space: pre-wrap; font-size: .92rem; }
  .follow { border-left: 2px solid var(--ink); padding: 2px 0 2px 12px; }
  .comp { display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
  .comp:first-child { border-top: 0; }
  .comp p { grid-column: 1 / -1; font-size: .86rem; color: var(--muted); }
  .wbar { height: 6px; border-radius: 6px; background: var(--soft); overflow: hidden; }
  .wbar i { display: block; height: 100%; background: var(--ink); }
  .rounds { list-style: none; margin: 0; padding: 0; counter-reset: r; }
  .rounds li { counter-increment: r; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  .rounds li:first-child { border-top: 0; }
  .rounds li::before { content: counter(r); font: 500 .76rem var(--mono); width: 22px; height: 22px; border-radius: 6px; background: var(--soft); display: grid; place-items: center; }
  .plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .plan > div { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .plan ul, .ul { margin: 6px 0 0; padding-left: 18px; font-size: .9rem; }
  .plan li, .ul li { margin-top: 3px; }

  /* expert pieces */
  .req { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; }
  @media (max-width: 640px) { .req { grid-template-columns: auto minmax(0, 1fr); } .req .acts { grid-column: 1 / -1; } }

  var DEMO_D = {"plan": {"role": {"title": "Senior Product Manager, Consumer Growth", "company_type": "Consumer fintech app, India", "level": "Senior PM (5+ years)", "summary": "You own the path from install to first successful payment and the first 30 days after it. The job is judged on whether activation and D30 retention move, and on how well you run experiments with risk and compliance in the room."}, "competencies": [{"id": "c1", "name": "Growth and funnel thinking", "why": "The core of the job is finding where new users drop off and fixing it.", "weight": 25}, {"id": "c2", "name": "Analytics and experiments", "why": "Decisions here rest on funnels, cohorts and A/B tests, often read in SQL.", "weight": 25}, {"id": "c3", "name": "Product sense for Indian users", "why": "Onboarding must work for first-time digital payment users on low-end phones.", "weight": 20}, {"id": "c4", "name": "Stakeholder leadership", "why": "Risk, compliance, marketing and leadership all pull on the same onboarding flow.", "weight": 15}, {"id": "c5", "name": "Payments and KYC domain", "why": "A plus in the posting, and it decides how fast you get trusted.", "weight": 15}], "rounds": [{"name": "Recruiter screen", "what": "Your story, why this company, and notice period."}, {"name": "Hiring manager", "what": "Past impact on a north-star metric, told with numbers."}, {"name": "Product sense", "what": "Design or improve a consumer flow, usually onboarding or a first payment."}, {"name": "Analytical case", "what": "A metric dropped or an experiment came back mixed. What do you do?"}, {"name": "Leadership and values", "what": "Conflict with risk or engineering, a decision you got wrong."}], "questions": [{"id": "q1", "competency": "c1", "type": "product", "title": "Fix the first-payment drop-off", "minutes": 15, "prompt": "Only 38% of users who install our app complete their first UPI payment within 7 days. Most drop between linking a bank account and making the payment. How would you diagnose this and what would you try first?", "good": ["Breaks the funnel into steps and asks for data before solving", "Separates can't (technical, bank linking failures) from won't (no reason to pay yet)", "Prioritises 2 or 3 bets with expected impact and how to test them"], "rubric": {"1": "Jumps to features with no diagnosis or data.", "2": "Some structure but generic ideas not tied to the drop-off point.", "3": "Clear funnel diagnosis, sensible hypotheses and a prioritised first bet.", "4": "Sharp diagnosis, sizes the opportunity, and designs tests that separate the causes."}}, {"id": "q2", "competency": "c2", "type": "analytical", "title": "A/B test with a mixed result", "minutes": 12, "prompt": "You tested a shorter onboarding with KYC moved to later. Activation went up 6% but fraud reports per 1,000 new users rose from 1.1 to 1.6, and D30 retention is flat. Leadership asks you whether to ship. What do you say?", "good": ["Checks significance and sample size before trusting either number", "Puts activation gain and fraud cost in the same unit (rupees or users)", "Proposes a middle path, such as risk-based KYC timing, and a clear decision rule"], "rubric": {"1": "Ships or kills on one number alone.", "2": "Notes the trade-off but gives no way to decide.", "3": "Weighs both with rough numbers and gives a clear recommendation.", "4": "Quantifies the trade-off, checks validity, and designs a better variant with guardrails."}}, {"id": "q3", "competency": "c3", "type": "product", "title": "Onboarding for a first-time user", "minutes": 12, "prompt": "Design the first five minutes in the app for a 45-year-old shop owner in a tier-3 town, on a low-end Android phone, who has never paid digitally. What does she see and do?", "good": ["Starts from her goal and fears, not from screens", "Designs for language, low bandwidth and trust (small first payment, clear reversal)", "Defines what success looks like for this user in the first session"], "rubric": {"1": "Generic onboarding with no thought for this user.", "2": "Mentions her context but the design ignores it.", "3": "A clear flow built around her language, trust and phone.", "4": "Insightful about her real motivation and measures whether it worked."}}, {"id": "q4", "competency": "c4", "type": "behavioral", "title": "Disagreeing with risk", "minutes": 8, "prompt": "Tell me about a time you disagreed with a risk, legal or compliance team about a product decision. What happened and what did you learn?", "good": ["A specific situation with real stakes", "Shows understanding of the other team's goal", "A clear outcome and what they would do differently"], "rubric": {"1": "Vague or blames the other team.", "2": "A real story but little self-reflection.", "3": "Clear story, shows empathy and a good outcome.", "4": "Changed how both teams work, with lessons applied since."}}, {"id": "q5", "competency": "c5", "type": "domain", "title": "Why do UPI payments fail?", "minutes": 8, "prompt": "About 4% of our first payments fail. Walk me through the main reasons a UPI payment fails, and which of them product can actually fix.", "good": ["Names the main failure types: bank downtime, wrong PIN, limits, network timeouts", "Separates what the app controls from what the bank or NPCI controls", "Suggests product fixes such as retry flows, bank health signals and clearer errors"], "rubric": {"1": "Doesn't know how UPI works.", "2": "Knows a few causes but no product angle.", "3": "Covers the main causes and practical product fixes.", "4": "Deep understanding, with ideas like routing users away from failing banks."}}]}, "answers": {"q1": "First I'd break the 62% who don't pay into steps: install, sign-up, bank linking (SIM binding + selecting bank + fetching account), setting UPI PIN, first payment. The prompt says most drop between linking and paying, so the user has a working account but doesn't pay.\n\nTwo groups: those who tried and failed (PIN setup errors, debit card needed for PIN, payment failures) and those who never tried (no reason to pay yet). I'd check PIN-setup failure rates and how many users ever opened the pay screen.\n\nIf it's 'no reason', I'd test a cashback on first payment to a contact and a self-transfer of Re 1 to prove it works. If it's PIN setup, I'd test Aadhaar-OTP based PIN setup so users don't need a debit card.\n\nI'd run both as A/B tests and measure 7-day first payment rate.", "q2": "I wouldn't ship as is. Activation up 6% is good but fraud up 45% is a big jump. I'd want to know if the fraud number is significant since it's a small base. If it is, I'd look at where the fraud comes from, probably new users who never complete KYC. I'd suggest only moving KYC later for low-risk users, like those with an existing bank account and a phone number older than 6 months, and keep it upfront for others. Then rerun the test.", "q3": "She probably wants to accept payments from customers more than make them. So the first screen should be in Hindi or her language, ask what she wants to do: receive money or pay. If receive, show her QR code straight away and let her test it with Re 1 from our side. Big buttons, voice instructions, works on 2G. Show a clear message that money goes straight to her bank. Success is her receiving one real payment in the first week.", "q4": "At my last company we wanted to launch a referral reward and compliance wanted us to add KYC for anyone who got more than Rs 500 in rewards. I thought it would kill the program. We argued for two weeks. In the end we launched with the limit and it worked fine. I learned compliance has good reasons.", "q5": "Payments fail because of bank server downtime, wrong UPI PIN, insufficient balance, daily limits, and network issues on the user's phone. Product can help with clearer error messages and maybe suggesting a retry."}, "evals": {"q1": {"score": 3, "verdict": "Structured diagnosis that separates failed attempts from no intent, with two testable bets.", "strengths": ["Broke the funnel into concrete steps and focused on the stated drop-off point", "Separated 'tried and failed' from 'never tried', which is the right first cut", "Aadhaar-OTP PIN setup is a strong, specific idea for users without a debit card"], "gaps": ["No sizing: which group is bigger, and how much could each fix move the 38%?", "Cashback is a costly default; no thought on cohort quality or abuse", "Missed qualitative research with users who linked a bank but didn't pay"], "better": "1. State the funnel with a rough share lost at each step.\n2. Split the drop-off into failed attempts and no attempt, and size each.\n3. For failures: fix PIN setup (Aadhaar OTP), bank-linking errors.\n4. For no intent: a 'first use' prompt tied to a real need (recharge, bill), not just cashback.\n5. Pick the first bet by size times confidence, define the metric and a guardrail (cost per activated user).", "followup": "Your Aadhaar OTP test lifts first payments by 5 points but costs Rs 2 per verification. How do you decide if it's worth it?"}, "q2": {"score": 3, "verdict": "Right instinct and a good middle path, but the trade-off isn't quantified.", "strengths": ["Questioned significance on a small fraud base before reacting", "Risk-based KYC timing is exactly the kind of variant a panel hopes to hear"], "gaps": ["Didn't convert the trade-off into one unit, such as rupees of fraud loss against value of extra activated users", "Didn't ask why D30 is flat: are the extra activations low quality?", "No clear decision rule for shipping the next version"], "better": "1. Check sample sizes and confidence for both metrics.\n2. Put both in rupees: extra activated users x expected value vs extra fraud x average loss.\n3. Note flat D30 suggests the extra users may be low intent.\n4. Recommend risk-based KYC timing; ship if activation holds above +3% and fraud stays within 1.2 per 1,000.\n5. Agree the guardrail with risk before launch.", "followup": "Risk says any rise in fraud is unacceptable. How do you respond?"}, "q3": {"score": 3, "verdict": "Good insight that she wants to receive money first; the flow is sensible but light on trust.", "strengths": ["Reframed her goal from paying to receiving, which is the key insight", "Re 1 test payment is a smart way to build trust", "Defined success as a real payment received in week one"], "gaps": ["Trust needs more: what if money doesn't arrive, who does she call?", "Didn't cover sign-up and bank linking for someone who may not know her account details", "No mention of an assisted path, such as a field agent or a family member"], "better": "1. Her goal: get paid by customers without cash hassles.\n2. Language picked by voice; one question: receive or pay.\n3. Bank linking via phone number with a helpline shown on every step.\n4. Instant QR plus a Re 1 test credit and an SMS confirming it reached her bank.\n5. Printed QR delivered or a share-to-print option.\n6. Success: first customer payment within 7 days; track by town tier.", "followup": "Half of these users drop off at bank linking. What do you change?"}, "q4": {"score": 2, "verdict": "A real situation, but little ownership or reflection, and no clear impact.", "strengths": ["Picked a relevant, specific conflict with compliance"], "gaps": ["No numbers: what did the limit cost, and did the program succeed?", "'We argued for two weeks' with no description of what you did to resolve it", "The lesson is generic; nothing about how you work with risk teams now"], "better": "Use STAR with numbers. Situation and stakes; what compliance was protecting (reward abuse, AML); what you proposed (data on reward abuse rates, a phased limit); the result in numbers; and the habit you built since (bringing risk in at PRD stage, a shared guardrail metric).", "followup": "Looking back, what would you do in the first week differently?"}, "q5": {"score": 2, "verdict": "Knows the common failure causes but not how product can reduce them.", "strengths": ["Listed the main failure causes correctly"], "gaps": ["Didn't separate app-side, bank-side and NPCI-side failures", "Product fixes are thin: no bank health routing, pre-checks or smart retries", "No sense of which causes are the biggest share"], "better": "1. Group failures: user (wrong PIN, balance, limits), bank (downtime, timeouts), network/app.\n2. Bank-side failures are often the largest; show a bank health signal and suggest another linked account.\n3. Pre-check limits and balance hints before the PIN screen.\n4. Clear, specific error copy with one next step.\n5. Track first-payment failure rate by bank and reason.", "followup": "One bank has 12% failures for two hours. What does the user see?"}}, "final": {"recommendation": "lean_no_hire", "headline": "Strong structured thinking on growth and experiments, which is the heart of this role. Behavioural stories and payments depth are below the bar for a senior PM and would likely cost the offer.", "risks": ["Behavioural answers lack numbers and ownership; a panel will doubt senior-level impact", "Thin payments domain knowledge for a fintech role where the posting asks for it", "Tends to stop before quantifying trade-offs, which leadership will push on"], "plan": [{"day": "Day 1", "focus": "Rebuild your stories", "tasks": ["Write 4 STAR stories with numbers: a metric you moved, a conflict, a failure, a hard decision", "For each, add what you'd do differently"]}, {"day": "Day 2", "focus": "UPI and KYC basics", "tasks": ["Learn how a UPI payment flows from app to bank, and where failures happen", "Read up on KYC levels and what's allowed before full KYC"]}, {"day": "Day 3", "focus": "Quantify trade-offs", "tasks": ["Redo the A/B question with real numbers in rupees", "Practise 2 metric-drop cases out loud, timing yourself to 10 minutes"]}, {"day": "Day 4", "focus": "Product sense for Bharat users", "tasks": ["Install 3 payment apps and note their first 5 minutes", "Redo the shop-owner question, adding trust and assisted onboarding"]}, {"day": "Day 5", "focus": "Ful
