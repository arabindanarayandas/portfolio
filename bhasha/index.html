<style>
  /* Layout: a single 560px phone-shaped column; screens swap inside <main>, a bottom tab bar on top-level screens. */
  :root {
    --paper: #FFF6E9; --card: #FFFFFF; --ink: #1E1940; --muted: #6D6782; --line: #EADFCB;
    --accent: #E5533C; --accent-ink: #FFFFFF; --good: #1F8A62; --good-soft: #E1F4EA; --bad: #C2402E; --bad-soft: #FCE6E1; --gold: #F4B740;
    --scr: "Baloo 2", "Baloo Da 2", "Baloo Bhai 2", "Baloo Bhaina 2", "Baloo Chettan 2", "Baloo Paaji 2", "Baloo Tamma 2", "Baloo Tammudu 2", "Baloo Thambi 2", sans-serif;
    --ui: "Figtree", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #15122B; --card: #201C3B; --ink: #F5EEFF; --muted: #A9A2C2; --line: #352F58; --good-soft: #143326; --bad-soft: #3A1A16; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #15122B; --card: #201C3B; --ink: #F5EEFF; --muted: #A9A2C2; --line: #352F58; --good-soft: #143326; --bad-soft: #3A1A16; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--ui); min-height: 100dvh; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .s { font-family: var(--scr); }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 96px) max(16px, env(safe-area-inset-left, 0px)); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 700; font-size: 1.05rem; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .08s; width: 100%; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .row { display: flex; gap: 10px; align-items: center; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1, h2 { font-family: var(--scr); line-height: 1.1; margin: 0; text-wrap: balance; }
  /* welcome */
  .hero { text-align: center; padding: 26px 0 18px; }
  .hello { height: 84px; display: grid; place-items: center; font: 800 clamp(2.6rem, 11vw, 3.6rem)/1 var(--scr); color: var(--accent); }
  .hello span { animation: pop .5s ease both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
  .hero h1 { font-size: clamp(1.7rem, 7vw, 2.2rem); margin-top: 4px; }
  .hero p { margin: 10px auto 0; max-width: 36ch; color: var(--muted); }
  .pairs { display: inline-flex; gap: 6px; align-items: center; margin-top: 14px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: .86rem; font-weight: 600; }
  .langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 18px; }
  .lang { border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center; box-shadow: 0 3px 0 var(--line); }
  .lang b { display: block; font: 700 1.25rem/1.2 var(--scr); }
  .lang span { font-size: .76rem; color: var(--muted); }
  .lang[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
  .lang:disabled { opacity: .3; }
  /* home */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .pairchip { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font: 700 1rem/1.2 var(--scr); }
  .stat { margin-left: auto; display: flex; gap: 12px; font-weight: 700; font-size: .95rem; }
  .goal { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; margin-bottom: 18px; }
  .ring { width: 54px; height: 54px; }
  .path { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .unit { width: 100%; text-align: left; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; border: 2px solid var(--line); background: var(--card); border-radius: 20px; padding: 12px 14px; box-shadow: 0 4px 0 var(--line); }
  .unit .ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 1.7rem; background: color-mix(in srgb, var(--gold) 25%, var(--card)); }
  .unit.locked { opacity: .5; }
  .unit.locked .ic { filter: grayscale(1); }
  .unit b { display: block; font-size: 1.05rem; }
  .unit .tgt { font: 600 .95rem/1.3 var(--scr); color: var(--muted); }
  .stars { font-size: .95rem; letter-spacing: 1px; white-space: nowrap; }
  .review { margin-top: 16px; }
  /* tab bar */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(8px, env(safe-area-inset-left, 0px)); }
  nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: .74rem; font-weight: 700; color: var(--muted); border-radius: 12px; }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button[aria-current="page"] { color: var(--accent); }
  /* lesson */
  .lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; font-size: 1.5rem; color: var(--muted); flex: none; }
  .bar { flex: 1; height: 14px; border-radius: 10px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); border-radius: 10px; transition: width .3s; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 22px 18px; text-align: center; }
  .card .big { font: 800 clamp(1.9rem, 8vw, 2.5rem)/1.2 var(--scr); margin: 6px 0 4px; overflow-wrap: anywhere; }
  .card .rom { font-weight: 600; color: var(--accent); font-size: 1.1rem; }
  .card .mean { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); font: 600 1.15rem/1.35 var(--scr); }
  .card .en { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .card .note { margin-top: 12px; font-size: .9rem; background: color-mix(in srgb, var(--gold) 18%, var(--card)); border-radius: 12px; padding: 8px 10px; text-align: left; }
  .say { width: 52px; height: 52px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent); display: inline-grid; place-items: center; margin-top: 8px; }
  .say svg { width: 26px; height: 26px; }
  .q { font: 700 1.35rem/1.3 var(--scr); margin: 6px 0 16px; }
  .qsub { color: var(--muted); font-size: .92rem; }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: 0 3px 0 var(--line); font: 600 1.15rem/1.3 var(--scr); }
  .opt small { display: block; font: 500 .85rem/1.3 var(--ui); color: var(--muted); }
  .opt[aria-pressed="true"] { border-color: #5B8DEF; box-shadow: 0 3px 0 #5B8DEF; }
  .opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
  .answer { min-height: 62px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; margin-bottom: 16px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tile { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; font-weight: 700; box-shadow: 0 3px 0 var(--line); }
  .tile.used { visibility: hidden; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); background: var(--paper); border-top: 2px solid var(--line); }
  .foot .in { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
  .foot.ok { background: var(--good-soft); border-color: var(--good); }
  .foot.no { background: var(--bad-soft); border-color: var(--bad); }
  .foot .msg { font-weight: 800; font-size: 1.1rem; }
  .foot.ok .msg { color: var(--good); } .foot.no .msg { color: var(--bad); }
  .foot .sol { font: 600 1rem/1.3 var(--scr); }
  .foot.ok .btn { background: var(--good); box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 60%, #000); }
  .foot.no .btn { background: var(--bad); box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 60%, #000); }
  .done { text-align: center; padding-top: 30px; }

  .chips { display: flex; justify-content: center; gap: 10px; margin: 18px 0 24px; flex-wrap: wrap; }
  .chips div { border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; background: var(--card); min-width: 92px; }
  .chips b { display: block; font-size: 1.4rem; }
  .chips span { font-size: .78rem; color: var(--muted); font-weight: 600; }
  /* phrasebook, check */
  .search { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); color: var(--ink); font: inherit; margin: 12px 0; }
  .ph { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ph .t { font: 700 1.2rem/1.3 var(--scr); }
  .ph .r { color: var(--accent); font-weight: 600; font-size: .92rem; }
  .ph .m { grid-column: 1 / -1; font: 500 .95rem/1.3 var(--scr); color: var(--muted); }
  .ph .say { width: 40px; height: 40px; margin: 0; grid-row: 1 / 3; grid-column: 2; }
  .ph .say svg { width: 20px; height: 20px; }
  h3.u { margin: 22px 0 0; font-size: 1rem; }
  .chk { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px; margin-top: 10px; }
  .chk .en { font-weight: 700; }
  .chk .t { font: 700 1.35rem/1.3 var(--scr); margin: 4px 0 0; }
  .chk .r { color: var(--accent); font-weight: 600; font-size: .92rem; }
  .chk .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }

  .chk .acts button.yes[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .banner { border-radius: 18px; padding: 14px 16px; background: color-mix(in srgb, var(--gold) 22%, var(--card)); border: 2px solid color-mix(in srgb, var(--gold) 60%, var(--line)); margin: 12px 0; font-size: .95rem; }
  .banner b { display: block; margin-bottom: 2px; }
  select.pick { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); color: var(--ink); font: 600 1rem var(--scr); }
  .meg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
  .meg div { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
  .meg b { display: block; font-size: 1.6rem; }
  .meg span { color: var(--muted); font-size: .85rem; font-weight: 600; }
  .list { list-style: none; padding: 0; margin: 8px 0; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  /* ---------- home ---------- */

  /* ---------- lesson ---------- */
  var L = null;
  function wordsOf(r) { return r.replace(/[.,!?]/g, '').split(/\s+/).filter(Boolean); }
  function makeQuestions(ids, pool) {
    var types = [], speak = canSay(S.to);
    ids.forEach(function (id, i) {
      var opts = ['pick_target', 'pick_meaning'];
      if (wordsOf(ph(S.to, id).roman).length >= 2) opts.push('build');
      if (speak) opts.push('listen');
      types.push({ id: id, type: opts[(i + Math.floor(Math.random() * opts.length)) % opts.length] });
    });
    return shuffle(types).map(function (q) {
      var others = shuffle(pool.filter(function (x) { return x !== q.id; })).slice(0, 3);
      q.choices = shuffle([q.id].concat(others));
      if (q.type === 'build') {
        var w = wordsOf(ph(S.to, q.id).roman), extra = shuffle(pool.filter(function (x) { return x !== q.id; }).reduce(function (a, x) { return a.concat(wordsOf(ph(S.to, x).roman)); }, []).filter(function (x) { return w.indexOf(x) < 0; })).slice(0, 2);
        q.tiles = shuffle(w.concat(extra)); q.answer = w;
      }
      return q;
    });
  }
  function startLesson(i) {
    var ids, pool = UNITS.reduce(function (a, u) { return a.concat(u.phrases.map(function (p) { return p.id; })); }, []);
    if (i < 0) {
      var learned = UNITS.filter(function (u) { return P()[u.id]; }).reduce(function (a, u) { return a.concat(u.phrases.map(function (p) { return p.id; })); }, []);
      ids = shuffle(learned).slice(0, 8);
    } else ids = UNITS[i].phrases.map(function (p) { return p.id; });
    L = { unit: i, ids: ids, phase: i < 0 ? 'quiz' : 'learn', k: 0, qs: makeQuestions(ids, pool), right: 0, combo: 0, picked: null, built: [], checked: false, missed: [] };
    count('bhasha/lesson/' + pairKey() + '/' + (i < 0 ? 'review' : UNITS[i].id), 'Lesson started');
    go('lesson');
  }
  function lessonHead(frac) { return '<div class="lhead"><button class="x" id="quit" aria-label="Leave lesson">✕</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(frac * 100) + '"><i style="width:' + (frac * 100) + '%"></i></div></div>'; }
  function vLesson() {
    if (!L) return go('home');
    var total = L.unit < 0 ? L.qs.length : L.ids.length + L.qs.length;
    if (L.phase === 'learn') {
      var id = L.ids[L.k], t = ph(S.to, id), showEn = S.from !== 'en';
      app.innerHTML = lessonHead(L.k / total) + '<div class="eyebrow">New phrase ' + (L.k + 1) + ' of ' + L.ids.length + '</div>' +
        '<div class="card" style="margin-top:10px"><div class="big" lang="' + S.to + '">' + esc(t.text) + '</div><div class="rom">' + esc(t.roman) + '</div>' + sayBtn(S.to, id, 'Hear it') +
        '<div class="mean" lang="' + S.from + '">' + esc(meaning(id)) + '</div>' + (showEn ? '<div class="en">' + esc(enOf(id)) + '</div>' : '') +
        (t.note ? '<div class="note">💡 ' + esc(t.note) + '</div>' : '') + '</div>';

    } else if (L.phase === 'quiz') {

      if (q.type === 'pick_target') {
        body = '<div class="eyebrow">Choose the right ' + esc(BY[S.to].name) + '</div><div class="q" lang="' + S.from + '">' + esc(meaning(q.id)) + '</div><div class="opts">' + q.choices.map(function (c) { return '<button class="opt" data-c="' + c + '" lang="' + S.to + '">' + esc(ph(S.to, c).text) + '<small>' + esc(ph(S.to, c).roman) + '</small></button>'; }).join('') + '</div>';
      } else if (q.type === 'pick_meaning' || q.type === 'listen') {

          '<div class="opts">' + q.choices.map(function (c) { return '<button class="opt" data-c="' + c + '" lang="' + S.from + '">' + esc(meaning(c)) + '</button>'; }).join('') + '</div>';
      } else {
        body = '<div class="eyebrow">Put the words in order</div><div class="q" lang="' + S.from + '">' + esc(meaning(q.id)) + '</div><div class="answer" id="ans"></div><div class="tiles">' + q.tiles.map(function (w, i) { return '<button class="tile" data-t="' + i + '">' + esc(w) + '</button>'; }).join('') + '</div>';
      }
      app.innerHTML = lessonHead(done / total) + '<div class="qsub" style="margin-bottom:4px">' + (L.combo >= 3 ? '🔥 ' + L.combo + ' in a row' : '&nbsp;') + '</div>' + body;
      if (q.type === 'listen' || q.type === 'pick_meaning') say(S.to, q.id);
      app.querySelectorAll('.opt').forEach(function (b) { b.addEventListener('click', function () { if (L.checked) return; L.picked = b.dataset.c; app.querySelectorAll('.opt').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); setCheck(true); }); });
      app.querySelectorAll('.tile').forEach(function (b) {
        b.addEventListener('click', function () {
          if (L.checked) return; b.classList.add('used'); L.built.push(+b.dataset.t);
          var ans = document.getElementById('ans'), t2 = document.createElement('button'); t2.className = 'tile'; t2.textContent = b.textContent;
          t2.addEventListener('click', function () { if (L.checked) return; var ix = L.built.indexOf(+b.dataset.t); L.built.splice(ix, 1); t2.remove(); b.classList.remove('used'); setCheck(L.built.length > 0); });

  function confirmLeave() { return true; }
  var footEl = null;
  function footer(cls, html, label, fn, disabled) {

  }
  function setCheck(on) { var b = document.getElementById('fbtn'); if (b) b.disabled = !on; }
  function check() {

    app.querySelectorAll('.opt').forEach(function (b) { if (b.dataset.c === q.id) b.classList.add('right'); else if (b.dataset.c === L.picked) b.classList.add('wrong'); });
    if (ok) { L.right++; L.combo++; } else { L.combo = 0; L.missed.push(q.id); }
    var t = ph(S.to, q.id);
    var praise = ['Nice!', 'Correct!', 'Spot on!', 'Great!', 'Shabaash!'][Math.floor(Math.random() * 5)];
    footer(ok ? 'ok' : 'no', '<div class="msg">' + (ok ? praise + (L.combo > 0 && L.combo % 3 === 0 ? ' +2 combo XP' : '') : 'Not quite. The answer:') + '</div><div class="sol" lang="' + S.to + '">' + esc(t.text) + ' · ' + esc(t.roman) + '<br><span class="muted" lang="' + S.from + '">' + esc(meaning(q.id)) + '</span></div>', 'Continue', function () { L.k++; if (L.k >= L.qs.length) L.phase = 'done'; vLesson(); });
    if (ok && L.combo > 0 && L.combo % 3 === 0) L.bonus = (L.bonus || 0) + 2;

  }
  function vDone() {
    if (footEl) { footEl.remove(); footEl = null; }
    var n = L.qs.length, r = L.right, pass = r >= Math.ceil(n * 0.75), stars = r === n ? 3 : r >= n - 1 ? 2 : pass ? 1 : 0;
    var xp = 10 + r * 2 + (L.bonus || 0);

      count('bhasha/done/' + pairKey() + '/' + (L.unit < 0 ? 'review' : UNITS[L.unit].id) + '/' + (pass ? 'pass' : 'fail'), 'Lesson finished');

    app.innerHTML = '<div class="done"><div class="big" aria-hidden="true">' + (lastUnit ? '🏆' : pass ? '🎉' : '💪') + '</div><h2>' + (lastUnit ? 'Course complete!' : pass ? (L.unit < 0 ? 'Review done!' : 'Unit complete!') : 'Almost there') + '</h2><p class="muted">' + (pass ? 'You got ' + r + ' of ' + n + ' right.' : 'You got ' + r + ' of ' + n + '. Get ' + Math.ceil(n * 0.75) + ' to unlock the next unit.') + '</p>' +
      '<div class="chips"><div><b>+' + xp + '</b><span>XP</span></div><div><b>🔥 ' + S.streak + '</b><span>day streak</span></div>' + (L.unit >= 0 && pass ? '<div><b style="color:var(--gold)">' + '★★★'.slice(0, stars) + '</b><span>stars</span></div>' : '') + '</div>' +
      (L.missed.length ? '<div class="banner" style="text-align:left"><b>Worth another look</b>' + L.missed.map(function (id) { return '<div lang="' + S.to + '" class="s" style="font-weight:700">' + esc(ph(S.to, id).text) + ' <span class="muted" style="font-weight:500">· ' + esc(meaning(id)) + '</span></div>'; }).join('') + '</div>' : '') +

    document.getElementById('goal').addEventListener('change', function (e) { S.goal = +e.target.value; save(); });
    document.getElementById('share').addEventListener('click', share);
    document.getElementById('pair').addEventListener('click', function () { go('welcome', { step: 'from' }); });
    var rs = document.getElementById('reset');
    rs.addEventListener('click', function () { if (rs.dataset.sure) { S.xp = 0; S.days = {}; S.streak = 0; S.last = null; S.prog = {}; save(); toast('Progress reset'); vMe(); } else { rs.dataset.sure = 1; rs.textContent = 'Tap again to confirm'; } });
  }

  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
