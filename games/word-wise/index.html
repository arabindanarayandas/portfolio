<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Wise</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Learn five new English words a day. Short levels, simple questions, real example sentences. Free and works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Wise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #FFFFFF; --soft: #F4F5F7; --ink: #16181D; --muted: #6B7280; --line: #E5E7EB;
    --accent: #4F46E5; --accent-soft: #EEF0FF; --good: #0F9D76; --good-soft: #E3F6EF; --bad: #E5484D; --bad-soft: #FDECEC; --gold: #F5A524;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --soft: #1B1E24; --ink: #F2F3F5; --muted: #9AA1AC; --line: #2A2E36; --accent: #8B85FF; --accent-soft: #23234A; --good: #34C79A; --good-soft: #13332A; --bad: #FF6B6F; --bad-soft: #3A1C1E; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px calc(env(safe-area-inset-bottom, 0px) + 16px); max-width: 560px; margin: 0 auto; overflow-y: auto; }
  .top { display: flex; align-items: center; gap: 10px; }
  .brand { flex: 1; font: 700 1.5rem/1 var(--serif); letter-spacing: -0.01em; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 0.9rem; padding: 6px 11px; border-radius: 999px; background: var(--soft); }
  .icon { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--soft); display: grid; place-items: center; padding: 0; flex: none; }
  .icon svg { width: 20px; height: 20px; }
  .icon .off { display: none; } .icon.is-off .on { display: none; } .icon.is-off .off { display: block; }

  /* home: level path */
  .hello { margin: 26px 0 8px; }
  .hello h1 { font: 700 1.9rem/1.15 var(--serif); margin: 0; letter-spacing: -0.01em; }
  .hello p { margin: 6px 0 0; color: var(--muted); }
  .bar { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; margin-top: 14px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 8px; transition: width .4s; }
  .tier { margin: 26px 0 0; font-weight: 700; font-size: 0.8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .path { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 48px 0 30px; }
  .node { position: relative; width: 74px; height: 74px; border-radius: 50%; border: 0; display: grid; place-items: center; font: 700 1.35rem var(--sans); background: var(--soft); color: var(--muted); }
  .node.done { background: var(--accent); color: #fff; }
  .node.cur { background: var(--accent); color: #fff; box-shadow: 0 0 0 6px var(--accent-soft); animation: bob 2s ease-in-out infinite; }
  .node.locked { cursor: default; }
  .node svg { width: 22px; height: 22px; }
  .stars { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; letter-spacing: 1px; color: var(--gold); white-space: nowrap; }
  .stars .e { color: var(--line); }
  .start-tag { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
  .start-tag::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .node.cur { animation: none; } }
  .foot { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 10px 0 20px; }
  .foot button { border: 0; background: none; color: var(--accent); font-weight: 600; text-decoration: underline; padding: 4px; }

  /* lesson */
  .lesson-top { display: flex; align-items: center; gap: 14px; }
  .close { border: 0; background: none; padding: 6px; color: var(--muted); }
  .close svg { width: 24px; height: 24px; display: block; }
  .progress { flex: 1; height: 10px; border-radius: 10px; background: var(--soft); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 10px; transition: width .3s; }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding: 32px 0 24px; }
  .kicker { font-weight: 700; font-size: 0.8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .word { font: 700 clamp(2.3rem, 11vw, 3.2rem)/1.05 var(--serif); margin: 8px 0 4px; letter-spacing: -0.01em; word-break: break-word; }
  .wordrow { display: flex; align-items: center; gap: 12px; }
  .say { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; padding: 0; }
  .say svg { width: 22px; height: 22px; }
  .pos { color: var(--muted); font-style: italic; }
  .meaning { font-size: 1.3rem; line-height: 1.4; margin: 18px 0 0; font-weight: 500; }
  .example { margin: 18px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--soft); color: var(--ink); line-height: 1.5; }
  .example b { color: var(--accent); }
  .syn { margin-top: 14px; color: var(--muted); font-size: 0.95rem; }
  .syn span { font-weight: 600; color: var(--ink); }
  .prompt { font-size: 1.2rem; font-weight: 600; line-height: 1.4; margin: 10px 0 22px; }
  .prompt .q { font: 700 2rem/1.15 var(--serif); display: block; margin-top: 6px; }
  .prompt .sent { font: 500 1.25rem/1.5 var(--sans); display: block; margin-top: 8px; }
  .blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--accent); }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; padding: 15px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); font-size: 1.02rem; line-height: 1.35; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: var(--accent); }
  .opt.good { border-color: var(--good); background: var(--good-soft); }
  .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
  .opt[disabled] { cursor: default; }
  .opt.dim { opacity: .55; }
  .main { width: 100%; border: 0; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 1.05rem; background: var(--accent); color: #fff; min-height: 56px; }
  .main:active { transform: translateY(1px); }
  .main.ghost { background: var(--soft); color: var(--ink); }
  .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--accent); width: 22px; border-radius: 8px; }
  .feedback { margin: 0 -20px calc(-16px - env(safe-area-inset-bottom, 0px)); padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 16px); border-radius: 22px 22px 0 0; }
  .feedback.good { background: var(--good-soft); }
  .feedback.bad { background: var(--bad-soft); }
  .feedback h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .feedback.good h3 { color: var(--good); } .feedback.bad h3 { color: var(--bad); }
  .feedback p { margin: 0 0 14px; }
  .feedback.good .main { background: var(--good); } .feedback.bad .main { background: var(--bad); }

  /* result */
  .result { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .bigstars { font-size: 3rem; letter-spacing: 6px; color: var(--gold); }
  .bigstars .e { color: var(--line); }
  .result h2 { font: 700 2rem/1.1 var(--serif); margin: 0; }
  .result p { color: var(--muted); margin: 0; }
  .learned { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0 14px; }
  .learned span { padding: 6px 12px; border-radius: 999px; background: var(--soft); font-weight: 600; font-size: 0.9rem; }
  .btns { display: grid; gap: 10px; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 0.92rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; text-align: center; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .install { margin-top: 6px; }
</style>
</head>
<body>

<section class="screen" id="home">
  <div class="top">
    <div class="brand">Word Wise</div>
    <span class="pill" title="Daily streak">🔥 <span id="streak">0</span></span>
    <span class="pill" title="Coins">🪙 <span id="coins">0</span></span>
    <button class="icon" id="mute" aria-label="Sound on"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg></button>
  </div>
  <div class="hello">

    <div class="bar"><i id="homeBar" style="width:0"></i></div>

  <div id="path"></div>
  <div class="foot">
    <div id="giftNote"></div>
    <button id="installBtn" hidden>Add Word Wise to your home screen</button>
    <div id="installHint" hidden></div>
    <div style="margin-top:8px">An <a href="/games/" style="color:inherit">AuroStudios</a> game</div>
  </div>
</section>

<section class="screen" id="lesson" hidden>
  <div class="lesson-top">
    <button class="close" id="quit" aria-label="Leave lesson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="progress"><i id="prog"></i></div>
  </div>
  <div class="stage" id="stage"></div>
  <div id="bottom"></div>
</section>

<section class="screen" id="result" hidden>
  <div class="result">
    <div class="bigstars" id="rStars"></div>
    <h2 id="rTitle"></h2>
    <p id="rInfo"></p>
    <div class="learned" id="rWords"></div>
    <div class="btns">
      <button class="main" id="rNext">Next level</button>
      <button class="main ghost" id="rAgain">Practise again</button>
      <button class="main ghost" id="rHome">Back to levels</button>
    </div>
  </div>
</section>
<div class="toast" id="toast"></div>

    Array.prototype.forEach.call(box.children, function (b) { if (!b.classList.contains('good') && !b.classList.contains('bad')) b.classList.add('dim'); });
    save('word-wise-v1', prog);
    var fb = el('div', 'feedback ' + (ok ? 'good' : 'bad'));
    fb.appendChild(el('h3', null, ok ? ['Correct!', 'Nice one!', 'Well done!', 'Spot on!'][Math.floor(Math.random() * 4)] : 'Not quite'));
    var p = el('p'); var b = el('b', null, cap(w.w)); p.appendChild(b); p.appendChild(document.createTextNode(' means ' + w.m.charAt(0).toLowerCase() + w.m.slice(1) + '.'));
    fb.appendChild(p);
    var c = el('button', 'main', 'Continue');
    c.addEventListener('click', next);
    fb.appendChild(c);
    $('bottom').innerHTML = ''; $('bottom').appendChild(fb);
    c.focus({ preventScroll: true });
  }
  function next() {
    L.step++;
    if (L.step < L.qs.length) renderQ(); else finish();
  }
  function finish() {
    setProg(total());
    var n = L.qs.length, c = L.correct;
    var stars = c >= n ? 3 : c >= n - 1 ? 2 : c >= n - 2 ? 1 : 0;
    var prev = prog.stars[L.lv] || 0;
    var earned = c * 2 + (stars === 3 ? 10 : 0);
    if (stars > prev) prog.stars[L.lv] = stars;
    studio.coins += earned; save('proto-studio', studio); save('word-wise-v1', prog);
    $('rStars').innerHTML = starStr(stars);
    $('rTitle').textContent = stars === 3 ? 'Perfect!' : stars ? 'Level ' + (L.lv + 1) + ' complete' : 'So close!';
    $('rInfo').textContent = c + ' of ' + n + ' correct · +' + earned + ' coins' + (stars ? '' : '. Get ' + (n - 2) + ' right to pass.');
    var lw = $('rWords'); lw.innerHTML = '';
    L.words.forEach(function (w) { lw.appendChild(el('span', null, cap(w.w))); });
    var nextLv = L.lv + 1;
    $('rNext').hidden = !stars || nextLv >= LEVELS;
    $('rNext').textContent = 'Level ' + (nextLv + 1);
    $('rAgain').textContent = stars ? 'Practise again' : 'Try again';
    if (stars) sfx('win'); else sfx('bad');
    show('result');
  }
  $('rNext').addEventListener('click', function () { startLevel(L.lv + 1); });
  $('rAgain').addEventListener('click', function () { startLevel(L.lv); });
  $('rHome').addEventListener('click', renderHome);
  $('quit').addEventListener('click', renderHome);
  document.addEventListener('keydown', function (e) {
    if ($('lesson').hidden) return;
    if (e.key === 'Enter') { var m = $('bottom').querySelector('.main'); if (m && document.activeElement !== m) { m.click(); e.preventDefault(); } }
    if (/^[1-4]$/.test(e.key)) { var o = $('stage').querySelectorAll('.opt')[+e.key - 1]; if (o && !o.disabled) o.click(); }
  });

  /* install */
  var deferred = null;
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function installUi() {
    if (standalone()) { $('installBtn').hidden = true; $('installHint').hidden = true; return; }
    if (deferred) { $('installBtn').hidden = false; $('installHint').hidden = true; return; }
    $('installBtn').hidden = true; $('installHint').hidden = false;
    $('installHint').textContent = /iphone|ipad|ipod/i.test(navigator.userAgent) ? 'To install: tap Share, then "Add to Home Screen".' : 'To install: open your browser menu and choose "Install app".';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; installUi(); });
  $('installBtn').addEventListener('click', function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; installUi(); }); });

  window.__ww = { get L() { return L; } };
  renderHome();
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
